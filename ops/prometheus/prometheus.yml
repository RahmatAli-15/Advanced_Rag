# Scrapes the API's /metrics. Two targets so either way of running the API works:
#   host.docker.internal:8000  uvicorn on the host (day-to-day dev)
#   api:8000                   the containerised API (`--profile full`)
# Whichever is not running just shows as "down" on the targets page.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: advancedrag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000", "api:8000"]

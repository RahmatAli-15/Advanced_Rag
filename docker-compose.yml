name: advancedrag

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: advancedrag
      POSTGRES_PASSWORD: advancedrag  # local-only dev credentials
      POSTGRES_DB: advancedrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advancedrag -d advancedrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full containerised API. For day-to-day dev, run uvicorn on the host
  # (`docker compose up postgres redis`) to keep hot reload fast.
  api:
    build: ./backend
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://advancedrag:advancedrag@postgres:5432/advancedrag
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

name: advancedrag

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: advancedrag
      POSTGRES_PASSWORD: advancedrag  # local-only dev credentials
      POSTGRES_DB: advancedrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advancedrag -d advancedrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full containerised API. For day-to-day dev, run uvicorn on the host
  # (`docker compose up postgres redis`) to keep hot reload fast.
  api:
    build: ./backend
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://advancedrag:advancedrag@postgres:5432/advancedrag
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Monitoring (ADR 0011): `docker compose --profile observability up -d`
  # Prometheus http://localhost:9090, Grafana http://localhost:3000 (dashboard "AdvancedRag").
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach uvicorn on the host (Linux too)

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      # Local-only: open read-only access, no login. Not for a public deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/advancedrag.json
    ports:
      - "3000:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
